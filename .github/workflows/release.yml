name: Release & Packaging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (Portable Zip)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync version with Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "Syncing app version to Git tag: $tagVersion"
          (Get-Content src/lazycdripper/__init__.py) -replace '__version__\s*=\s*".*?"', "__version__ = `"$tagVersion`"" | Set-Content src/lazycdripper/__init__.py
          (Get-Content pyproject.toml) -replace 'version\s*=\s*".*?"', "version = `"$tagVersion`"" | Set-Content pyproject.toml

      - name: Install dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller
          python -m pip install .

      - name: Download bundled FLAC & LAME for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          # Download FLAC Win64 from Xiph.org
          curl.exe -L -o flac.zip "https://github.com/xiph/flac/releases/download/1.4.3/flac-1.4.3-win.zip"
          Expand-Archive -Path flac.zip -DestinationPath flac_extracted -Force
          Get-ChildItem -Path flac_extracted -Filter "flac.exe" -Recurse | Where-Object { $_.FullName -like "*Win64*" } | Select-Object -First 1 | Move-Item -Destination bin/flac.exe -Force
          Remove-Item -Recurse -Force flac.zip, flac_extracted

          # Download LAME x64 from RareWares
          curl.exe -L -o lame.zip "https://www.rarewares.org/files/mp3/lame-3.101.b3-q4patched-x64.zip"
          Expand-Archive -Path lame.zip -DestinationPath lame_extracted -Force
          Get-ChildItem -Path lame_extracted -Filter "lame.exe" -Recurse | Select-Object -First 1 | Move-Item -Destination bin/lame.exe -Force
          Get-ChildItem -Path lame_extracted -Filter "lame_enc.dll" -Recurse | Select-Object -First 1 | Move-Item -Destination bin/lame_enc.dll -Force
          Remove-Item -Recurse -Force lame.zip, lame_extracted

      - name: Build Standalone Package with PyInstaller
        run: |
          pyinstaller --clean lazycdripper.spec

      - name: Copy bundled bin and licenses to dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/LazyCDRipper/bin
          if (Test-Path bin) {
            Copy-Item bin/* dist/LazyCDRipper/bin/ -Force -Recurse
          }
          Copy-Item LICENSE dist/LazyCDRipper/LICENSE -Force
          Copy-Item THIRD_PARTY_LICENSES.md dist/LazyCDRipper/THIRD_PARTY_LICENSES.md -Force

      - name: Create Portable Zip Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LazyCDRipper/* -DestinationPath dist/LazyCDRipper-Windows-x64-portable.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: |
            dist/LazyCDRipper-Windows-x64-portable.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download all release artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets/

      - name: Flatten release assets
        run: |
          mkdir -p final-assets
          find release-assets/ -type f -exec cp {} final-assets/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: final-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
